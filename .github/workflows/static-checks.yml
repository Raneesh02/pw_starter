name: Static Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: static-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve commit SHA
        id: pr
        run: echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      # The `static-checks` commit status gates the `ai_review` workflow.
      - name: Set pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }} \
            -f state=pending -f context="static-checks" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so every problem is reported in one run.
      - name: TypeScript (tsc --noEmit)
        id: tsc
        if: always()
        run: npx tsc --noEmit

      - name: ESLint
        id: lint
        if: always()
        run: npx eslint . --format stylish

      - name: Prettier
        id: format
        if: always()
        run: npx prettier --check .

      - name: Guideline Checks (grep)
        id: guidelines
        if: always()
        run: |
          failed=0
          check() { # $1 = message, rest = grep command
            local msg="$1"; shift
            if out=$("$@"); then
              echo "$out"
              echo "::error::$msg"
              failed=1
            fi
          }

          check "Found banned waitForTimeout() calls" \
            grep -rn "waitForTimeout" tests/ pages/ common_actions/
          check "Found expect() assertions inside Page Objects" \
            grep -rn "expect(" pages/
          check "Found raw @playwright/test imports in specs (import from ../../fixtures)" \
            grep -rn --exclude="auth.setup.ts" "from '@playwright/test'" tests/
          check "Found console.log in specs/page objects" \
            grep -rn "console\.log" tests/ pages/ common_actions/
          check "Found test cases missing the @regression tag" \
            sh -c "grep -rnE --exclude='auth.setup.ts' \"^\s*test(\.only)?\(\" tests/ | grep -v '@regression'"
          check "Found focused tests (test.only / describe.only)" \
            grep -rnE "(test|describe)\.only\(" tests/

          exit $failed

      - name: Summary
        if: always()
        run: |
          {
            echo "## Static Checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| TypeScript | ${{ steps.tsc.outcome }} |"
            echo "| ESLint | ${{ steps.lint.outcome }} |"
            echo "| Prettier | ${{ steps.format.outcome }} |"
            echo "| Guideline greps | ${{ steps.guidelines.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }} \
            -f state=${{ job.status == 'success' && 'success' || 'failure' }} -f context="static-checks" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
