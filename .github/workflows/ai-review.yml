            Follow the workflow in .claude/skills/pw-code-review/SKILL.md against this PR
            (diff: `git diff origin/main...HEAD`). Read agent-context/CODING_GUIDELINES.md first.
            Report only; never edit files, commit, or push.

            Do NOT post anything to GitHub. Write the review to ./review.json (Write tool) as:
            {"summary": "<markdown>", "comments": [{"path": "<file>", "line": <int>, "severity": "Blocker|Major|Minor|Suggestion", "section": "§N or —", "body": "<issue — fix>"}]}

            Rules:
            - One entry in "comments" per finding that maps to a specific line. "line" must be a line
              added or changed in the PR head (right side of the diff), 1-indexed in the new file.
            - Findings with no single line (cross-file, coverage gaps) go in "summary", not "comments".
            - "summary" markdown format:
              ## Summary
              Overall Risk: Low | Medium | High
              ## Human Review Required
              **Required:** Yes/No — **Level:** Low/Medium/High — **Reason:** ...
              (High: auth, payments, security, core config; Medium: complex page workflows; Low: routine specs.)
              End with:
              reviewers: pw-guideline-reviewer, pw-investigative-reviewer
              tests: <n> passed / <n> failed
          claude_args: >-
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(npx playwright test:*),Write"

      - name: Post inline review
        if: steps.gate.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          jq -e '(.summary | type == "string") and (.comments | type == "array")' review.json > /dev/null
          api="repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews"
          jq --arg sha "$SHA" '{
            commit_id: $sha, event: "COMMENT", body: .summary,
            comments: [.comments[] | {path, line, side: "RIGHT",
              body: ("**" + .severity + "**" + (if (.section // "—") != "—" then " (" + .section + ")" else "" end) + " — " + .body)}]
          }' review.json > payload.json
          if ! gh api "$api" --input payload.json > /dev/null; then
            echo "::warning::Inline post rejected (line not in diff?); falling back to a single summary review."
            jq --arg sha "$SHA" '{
              commit_id: $sha, event: "COMMENT",
