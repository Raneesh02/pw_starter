      github.event.issue.pull_request &&
      github.event.comment.body == 'ai_review' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code (Full History)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Get PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify static-checks passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/${{ github.repository }}/commits/${{ steps.pr.outputs.sha }}/statuses \
            --jq '[.[] | select(.context == "static-checks")] | first | .state // "not started"')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "success" ]; then
            gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
              --body "AI review skipped: required **static-checks** status is \`$state\`. Comment \`static_check\`, fix any failures, then comment \`ai_review\` again."
          fi

      - name: Set pending status
        if: steps.gate.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }} \
            -f state=pending -f context="ai-review" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

