name: AI review

on:
  issue_comment:
    types: [created]

jobs:
  ai-review:
    # Only run for a comment on a PR (not a plain issue) that contains the
    # trigger word, and only for commenters with write access to the repo.
    # The author-association check runs before checkout/npm ci so an
    # untrusted commenter can't get arbitrary code from the PR executed here.
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'ai_review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Use the review-playwright-test skill to review the changes in this pull
            request (the PR branch is already checked out in the current working
            directory).

            Post findings as inline PR review comments on the exact lines they refer
            to, using mcp__github_inline_comment__create_inline_comment with
            confirmed: true. Only fall back to a top-level `gh pr comment` for a
            finding that doesn't map to a specific line.

            Do not edit or fix the code - report findings only.
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(npx tsc --noEmit:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
